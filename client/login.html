<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Private Chat Room | Login</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <main class="auth-page">
      <section class="auth-panel" aria-labelledby="auth-title">
        <div class="auth-header">
          <p class="auth-kicker">Private Chat Room</p>
          <h1 id="auth-title">로그인</h1>
          <p class="auth-description">
            아이디로 입장하거나 새 플레이어 계정을 만들어 로비로 이동하세요.
          </p>
        </div>

        <div class="auth-tabs" role="tablist" aria-label="인증 방식 선택">
          <button
            class="auth-tab is-active"
            id="login-tab"
            type="button"
            role="tab"
            aria-selected="true"
            aria-controls="login-form"
            data-auth-tab="login"
          >
            로그인
          </button>
          <button
            class="auth-tab"
            id="signup-tab"
            type="button"
            role="tab"
            aria-selected="false"
            aria-controls="signup-form"
            data-auth-tab="signup"
          >
            회원가입
          </button>
        </div>

        <p class="auth-message" id="auth-message" aria-live="polite"></p>

        <form class="auth-form" id="login-form" data-auth-form="login">
          <label class="field">
            <span>아이디</span>
            <input
              type="text"
              name="username"
              autocomplete="username"
              placeholder="player_01"
              pattern="[a-z0-9_]+"
              minlength="3"
              maxlength="20"
              required
            />
          </label>

          <label class="field">
            <span>비밀번호</span>
            <input
              type="password"
              name="password"
              autocomplete="current-password"
              placeholder="비밀번호"
              minlength="6"
              required
            />
          </label>

          <button class="primary-button" type="submit">로그인</button>
        </form>

        <form
          class="auth-form is-hidden"
          id="signup-form"
          data-auth-form="signup"
        >
          <label class="field">
            <span>아이디</span>
            <input
              type="text"
              name="username"
              autocomplete="username"
              placeholder="영어 소문자, 숫자, 언더바만"
              pattern="[a-z0-9_]+"
              minlength="3"
              maxlength="20"
              required
            />
          </label>

          <label class="field">
            <span>닉네임</span>
            <input
              type="text"
              name="nickname"
              autocomplete="nickname"
              placeholder="사용할 닉네임"
              minlength="2"
              maxlength="20"
              required
            />
          </label>

          <label class="field">
            <span>비밀번호</span>
            <input
              type="password"
              name="password"
              autocomplete="new-password"
              placeholder="6자 이상 입력"
              minlength="6"
              required
            />
          </label>

          <button class="primary-button" type="submit">회원가입</button>
        </form>
      </section>
    </main>

    <!-- Supabase 브라우저 SDK를 먼저 불러온 뒤, 프로젝트 설정과 인증 로직을 연결합니다. -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./js/supabase.js"></script>
    <script src="./js/auth.js"></script>
  </body>
</html>
